
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signin-Task-Manager</title>

    <!-- Styles -->
    <link rel="stylesheet" href="signin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body>
<!-- login page-->
<div class="form">
<div class="fbox"> 
    <form> 
    <fieldset>
        <div class="main-contener">
        <div class="group1">
        <h1>sign In</h1>
        <h5>to get started</h5>
        </div>

        <div class="group2">
        <input type ="email" id="email" placeholder="Email">
        <input type ="password" id="password" placeholder="Password">
        </div>

        <div class="group3">
       <button type="button" id="forgotpassword"><span><h6>Forgot Password?</h6></span></button>
        </div>

        <div class="group4">
        <button type="button" id="login">Sign In</button>
        <p>New user? <button  type="button"  id="signup"><span>Sign up</span></button></p>

        </div>
        </div>
        </fieldset>
    </form>
</div>
</div>

<script src="signin.js"></script>
</body>
</html>
