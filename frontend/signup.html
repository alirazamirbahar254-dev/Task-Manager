<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signin-task_manager</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    

<!--sign-up page-->

<div class="signupform1">
<div class="signupform2">
<fieldset>

<h2>Sign Up</h2>
<h4>to create your account</h4>

<div class="names">
<input type="text" id="name1" placeholder="First Name">
<input type="text" id="name2" placeholder="Last Name">
</div>

<input type="email" id="signupemail" placeholder="Email">

<input type="password" id="sign1password" placeholder="Password">
<input type="password" id="sign2password" placeholder="Confirm Password">

<div id="check">
<input type="checkbox" id="terms"> <p>I agree to Terms & Conditions</p>
</div>

<button type="submit" id="signup">Sign Up</button>

</fieldset>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
