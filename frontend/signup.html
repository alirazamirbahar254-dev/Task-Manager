<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup-task_manager</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    
<!--sign-up page-->

<div class="signupform1">
<div class="signupform2">
<fieldset>
<!--the main container of all gruops-->
<div class="groups-container">
<div class="group1">
<div class="title">
<h2>Sign Up</h2>
<h4>to create your account</h4>
</div>
</div>

<div class="group2">
<div class="names">
<input type="text" id="name1" placeholder="First Name">
<input type="text" id="name2" placeholder="Last Name">
</div>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password1" placeholder="Password">
<input type="password" id="password2" placeholder="Confirm Password">
</div>

<div class="group3">
<div id="check">
<input type="checkbox" id="terms"><p>I agree to Terms & Conditions</p>
</div>
<button type="submit" id="signup">Sign Up</button>
</div>
<div class="group4">
<p>Already have an account?<button type="button" id="signin"><span>Sign In</span></button></p>
</div>
</div>
</fieldset>
</div>
</div>
<script src="signup.js"></script>
</body>
</html>
