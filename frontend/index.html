<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task-Manager</title>

<!-- Styles -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="./profile/profile.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<!-- Navigation -->
<div class="nav">
<div class="nav-left">
    <div class="app-logo">
   <img src="./images/todo.png" id="todo-logo">
    </div>

    <div class="search-box">
    <button id="searchbtn" data-action="search"></button>
    <i data-lucide="search"></i>
    <input type="text" id="search" placeholder="     Search....">
    </div>
</div>

<div class="nav-actions">
<div class="sort-wrapper"> 
        <button id="them"><i data-lucide="moon"></i></button>
        <button class="sort-btn">↕-Sort</button>
        <div class="sort-menu">
        <button data-sort="newest">Newest</button>
        <button data-sort="oldest">Oldest</button>
        <button data-sort="az">A → Z</button>
        <button data-sort="za">Z → A</button>
    </div>
</div>

    <div class="profile">
        <button id="profilebtn"><img src="" data-profile-img alt="profile" width="50" height="50">
        <span id="outer-letter"></span>
        </button>
        <div id="profile-container"></div>
        </div>
    </div>
</div>
</div>

<!-- Board Columns -->
<div class="section">
    <div class="column" id="box1">
        <div class="column-header">
            <h4><i class="ti ti-circle-dashed col-icon"></i> Backlogs</h4>
            <span class="count-badge">0</span>
            <button class="collapse-btn" data-action="collapse" aria-label="Toggle column">
                <i class="ti ti-arrows-minimize collapse-icon"></i>
            </button>
            <button class="add-btn" data-action="add" data-column="box1">+</button>
        </div>
        <div class="box"></div>
    </div>

    <div class="column" id="box2">
        <div class="column-header">
            <h4><i class="ti ti-circle col-icon"></i> Todo</h4>
            <span class="count-badge">0</span>
            <button class="collapse-btn" data-action="collapse" aria-label="Toggle column">
                <i class="ti ti-arrows-minimize collapse-icon"></i>
            </button>
            <button class="add-btn" data-action="add" data-column="box2">+</button>
        </div>
        <div class="box"></div>
    </div>

    <div class="column" id="box3">
        <div class="column-header">
            <h4><i class="ti ti-progress-check col-icon"></i> In Progress</h4>
            <span class="count-badge">0</span>
            <button class="collapse-btn" data-action="collapse" data-action="collapse" aria-label="Toggle column">
                <i class="ti ti-arrows-minimize collapse-icon"></i>
            </button>
            <button class="add-btn" data-action="add" data-column="box3">+</button>
        </div>
        <div class="box"></div>
    </div>

    <div class="column" id="box4">
        <div class="column-header">
            <h4><span class="icon-done-wrap"><i class="ti ti-check"></i></span> Done</h4>
            <span class="count-badge">0</span>
            <button class="collapse-btn" data-action="collapse" aria-label="Toggle column">
                <i class="ti ti-arrows-minimize collapse-icon"></i>
            </button>
            <button class="add-btn" data-action="add" data-column="box4">+</button>
        </div>
        <div class="box"></div>
    </div>
</div>

<!-- Delete Confirmation -->
<div class="boxd">
    <h3>Delete Task</h3>
    <p>Are you sure you want to delete this task?</p>
    <button class="yes" data-action="yes">Yes</button>
    <button class="no" data-action="no">Cancel</button>
</div>

<!-- Undo Notification -->
<div class="undo-box">
    <h3>🗑️ Task Deleted</h3>
    <button class="undo-btn" data-action="undo">↶ Undo</button>
</div>

<!-- Task Modal -->
<div class="columnbox">
    <label for="column1">Title</label>
    <input type="text" id="column1" placeholder="Enter Title.....">

    <label for="column2">Description</label>
    <textarea id="column2" placeholder="Enter Description......."></textarea>
        
    <button class="column-btn" data-action="cancel" id="columnbtn1">❌</button>
    <button class="column-btn" data-action="confirm" id="columnbtn2">✅</button>
</div>

<!-- Scripts -->
<script type="module"  src="script.js"></script>
</body>
</html>
