<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | Task Manager</title>
    <link rel="stylesheet" href="Account.css">
    <link rel="stylesheet" href="./Logout-all-devices/logout.css">
    <link rel="stylesheet" href="./delete_account/delete.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<!-- full_page container -->
<main class="main_container"> 

<div class="container">
<div id="logout-popup-container"></div>
</div>
<div class="delet_container">
<div id="delete-popup-container"></div>
</div>

<div class="header_space">
<!-- title and description for page -->
<header class="page_header">
<h1>Account Settings</h1>
<p>Manage your account and security preferences.</p>
</header>

<!-- the container in the main container for options  -->
<div class="account_options">
</div>

<fieldset>
<h2>Account Preferences</h2>

<div class="field_options">
<div class="change_email">

    <div id="email_icon_box">
        <div id="icon">
            <i data-lucide="mail" id="email_icon"></i>
        </div>
    </div>

    <div class="edit_box">
        <div>
            <h4>Change Email</h4>
            <p>Update your Email or name</p>
        </div>

        <button id="edit">Edit</button>
    </div>
</div>

<div class="logout_devices">
<div id="logout_icon_box">
<div id="logout"><i data-lucide="log-out" id="logout_icon"></i></div>
</div>
<div class="logout_text">
<div>

<h4>Logout from All Devices</h4> 
<p>Sign out of your account on all devices</p>
</div>
 <div id="arrow_logout_box"><i data-lucide="chevron-right" id="arro_logout"></i></div>
</div>
<div>
 
</div>
</div>

<div class="delete_account">
<div delete_icon_box >
<div id="delete"><i data-lucide="trash-2" id="delete-icon"></i></div>
</div>

<div class="delete_text">
<div>
<h4>Delete Account</h4>
<p>Permanently remove your account and data</p>
</div>
<div id="arrow_delete_box"><i data-lucide="chevron-right" id="arro_delete"></i></div>
</div>
</div>
<div>
</div>
</div>
</div>

</fieldset>
</div>
</main>

<script>
  lucide.createIcons();
</script>
</body>
<script type="module" src="Account.js"></script>
</html>
