<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Profile Settings | Task Manager</title>
    <link rel="stylesheet" href="settings.css">
    <script src="https://unpkg.com/lucide@latest"></script>

</head>
<body>
    <main class="settings-page">
        <header class="page-header">
            <h1>Profile Settings</h1>
            <p>Update your profile photo and name.</p>
        </header>

        <form class="settings-card">
            <section class="setting-section" aria-labelledby="photo-heading">
                <div class="section-copy">
                    <h2 id="photo-heading">Profile Photo</h2>
                    <p>Choose a photo that represents you.</p>
                </div>
            
                <div class="photo-controls">
                <div class="avatar-wrapper">
                    <div id="icon-box"><i data-lucide="pencil" id="edit-icon"></i></div>
                    <div class="avatar-placeholder" role="img" aria-label="Profile photo placeholder">
                    <span aria-hidden="true"></span>
                    </div>
                    </div>

                <div class="edit">
                <input type="text" id="edit-text">
                <span id="normal-text"></span>
                <span id="email"></span>
                </div>
                </div>
            </section>
        </form>
    </main>
    <script type="module" src="settings.js"></script>
</body>
</html>
