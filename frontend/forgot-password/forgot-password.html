<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Task Manager</title>
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
    <main class="forgot-password-page">
        <form class="forgot-password-card">
            <fieldset>
                <h1>Forgot Password</h1>
                <input type="email" id="email" name="email" placeholder="Email" aria-label="Email" required>
                <button type="button" id="send-password">Send Password</button>
                <p id="message"></p>
            </fieldset>
        </form>
    </main>
    <script src="forgot-password.js"></script>
</body>
</html>
