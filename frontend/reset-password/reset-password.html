<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Task Manager</title>
    <link rel="stylesheet" href="reset-password.css">
</head>
<body>
    <main class="reset-password-page">
        <form class="reset-password-card">
            <fieldset>
                <h1>Reset Password</h1>
                <input type="password" id="new-password" name="new-password" placeholder="New Password" aria-label="New Password" required>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" aria-label="Confirm Password" required>
                <button type="button" id="reset-password">Reset Password</button>
                <p id="message"></p>
                
            </fieldset>
        </form>
    </main>
    <script src="reset-password.js"></script>
</body>
</html>
